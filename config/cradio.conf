# Enable deep sleep to turn off radios when not in use
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes of inactivity (in milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Permanently disable RGB/Underglow code to save processing power
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Completely disable external power switching since you have no screens
CONFIG_ZMK_EXT_POWER=n
# Battery reporting: nivelul propriei jumătăți (BAS) + nivelul perifericului.
# ZMK v0.3: PROXY e sub `if FETCHING`, deci ambele sunt necesare ca hostul să vadă două niveluri.
CONFIG_ZMK_BATTERY_REPORTING=y
# Interval în SECUNDE (5 min). Default 60; timer-ul e oprit în IDLE/SLEEP, deci nu atinge sleep-ul.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
# Centralul (cradio_left) cere nivelul de la periferic și îl expune ca al doilea BAS.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# USB boot protocol support (BIOS/UEFI/BitLocker pre-boot). HKRO default e deja compatibil.
CONFIG_ZMK_USB_BOOT=y

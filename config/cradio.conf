# Enable deep sleep to turn off radios when not in use
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes of inactivity (in milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Permanently disable RGB/Underglow code to save processing power
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Completely disable external power switching since you have no screens
CONFIG_ZMK_EXT_POWER=n
